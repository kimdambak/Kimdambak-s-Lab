<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김담박스랩</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #0a0e1a;
      color: #f2f2f2;
    }
    main { max-width: 560px; text-align: center; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid #c8a465;
      border-radius: 999px;
      color: #c8a465;
      font-size: 14px;
      margin-bottom: 24px;
    }
    h1 { font-size: 44px; margin-bottom: 16px; }
    p { font-size: 18px; line-height: 1.7; color: #c9ccd6; }
    .links { margin-top: 32px; }
    a {
      display: inline-block;
      padding: 12px 22px;
      background: #c8a465;
      color: #0a0e1a;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover { opacity: 0.85; }
    footer { margin-top: 40px; font-size: 13px; color: #7d8296; }
  </style>
</head>
<body>
  <main>
    <span class="badge">첫 배포 완료</span>
    <h1>김담박스랩</h1>
    <p>AI라는 별자리에 내 마우스는 첫 번째 파티션입니다.</p>
    <div class="links">
      <a href="https://github.com/" target="_blank" rel="noopener">GitHub 구경하기</a>
    </div>
    <footer>GitHub에 저장하고 Vercel로 배포한 나의 첫 사이트</footer>
  </main>
</body>
</html>
